<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>USB 异常趋势</title>
<style>
  /* ============================================================
     设计要点（对应 skill §11 视觉质量）
     1. 排版层次：结论标题 / 副标题 / 轴标签 / 来源行，三个字号，清楚次序
     2. 对齐：标题、图表、详情面板共享同一条左边缘
     3. 留白：充裕外边距；拥挤的图读起来焦虑
     4. 配色：上下文用低饱和同色系阶梯，折线用唯一强调色
     5. 层次：数据 > 坐标轴 > 网格，网格几乎看不见
     ============================================================ */
  :root {
    --bg:#ffffff;
    --ink:#16181d;            /* 标题 */
    --ink-2:#3d434f;          /* 正文 */
    --muted:#767d8c;          /* 次要 */
    --faint:#a3a9b6;          /* 来源行 / 轴标签 */

    --surface:#ffffff;
    --sunken:#f7f8fa;
    --hair: rgba(22,24,29,.08);      /* 发丝线：极淡 */
    --grid: rgba(22,24,29,.055);
    --hover: rgba(22,24,29,.035);
    --focus:#4f46e5;

    /* 三段：同一色系的明度阶梯 —— 既区分又协调，且天然色觉友好 */
    --seg-1:#c9d2e6;
    --seg-2:#7b8ab5;
    --seg-3:#39466f;
    /* 折线：唯一强调色，与柱形成冷/暖对比 */
    --accent:#c2410c;
    --accent-soft: rgba(194,65,12,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e0f12;
      --ink:#f2f3f6;
      --ink-2:#c5c9d3;
      --muted:#8b91a0;
      --faint:#666d7c;

      --surface:#15171c;
      --sunken:#101216;
      --hair: rgba(242,243,246,.10);
      --grid: rgba(242,243,246,.055);
      --hover: rgba(242,243,246,.045);
      --focus:#a5b4fc;

      /* 深色模式不是反转：重新挑一组，降低饱和、拉开明度 */
      --seg-1:#2c3550;
      --seg-2:#4d5f92;
      --seg-3:#8ea2d8;
      --accent:#fb923c;
      --accent-soft: rgba(251,146,60,.12);
    }
  }

  * { box-sizing:border-box; }
  html, body { background:var(--bg); }
  body {
    margin:0;
    padding:40px 32px 56px;
    color:var(--ink-2);
    font:13.5px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* 所有内容对齐到同一条左边缘 */
  .page { max-width:1080px; margin:0 auto; }

  /* ---- 排版层次 ---- */
  .head { margin-bottom:28px; }
  .finding {                       /* 结论式标题：说的是发现，不是"图表" */
    font-size:19px; font-weight:640; line-height:1.4;
    color:var(--ink); letter-spacing:-.005em; margin:0 0 6px;
  }
  .finding em { font-style:normal; color:var(--accent); }
  .subtitle { font-size:12.5px; color:var(--muted); margin:0; }
  .source { font-size:11px; color:var(--faint); margin-top:28px; }

  /* ---- 图表卡片 ---- */
  .card {
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    padding:22px 24px 16px;
  }
  .chart-wrap { position:relative; height:300px; contain:layout paint; }
  .chart-wrap svg { display:block; width:100%; height:100%; }

  /* 轴刻度：HTML 覆盖，避免被非等比拉伸的 SVG 变形 */
  .ylab { position:absolute; left:0; top:0; bottom:0; width:58px; pointer-events:none; }
  .ylab span {
    position:absolute; right:10px; transform:translateY(-50%);
    font-size:11px; color:var(--faint);
    font-variant-numeric:tabular-nums; letter-spacing:.01em;
  }
  .xlab {
    display:flex; justify-content:space-between;
    padding:6px 0 0 58px;
    font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums;
  }

  /* 折线末端的直接标注（比图例更快被读到） */
  .endlabel {
    position:absolute; transform:translateY(-50%);
    font-size:11px; font-weight:600; color:var(--accent);
    background:var(--surface); padding:1px 5px; border-radius:5px;
    pointer-events:none; white-space:nowrap;
  }

  /* 悬停读数 */
  .tip {
    position:absolute; z-index:6; display:none; pointer-events:none;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:10px;
    padding:9px 12px;
    font-size:12px; color:var(--ink-2);
    box-shadow:0 8px 28px -6px rgba(10,12,20,.22), 0 2px 6px -2px rgba(10,12,20,.12);
    white-space:nowrap;
  }
  .tip .d { font-weight:640; color:var(--ink); margin-bottom:5px; }
  .tip .r { display:flex; align-items:center; gap:8px; line-height:1.9; }
  .tip .r i { width:9px; height:9px; border-radius:3px; flex:none; }
  .tip .r b { margin-left:auto; padding-left:16px; font-variant-numeric:tabular-nums; color:var(--ink); }

  /* ---- 详情面板：与图表共享左边缘，选中后保持 ---- */
  .detail {
    margin-top:16px; padding:18px 24px;
    background:var(--sunken);
    border:1px solid var(--hair);
    border-radius:14px;
    min-height:96px;
  }
  .detail .t { font-size:13px; font-weight:620; color:var(--ink); margin-bottom:12px; }
  .detail .row { display:flex; gap:34px; flex-wrap:wrap; }
  .detail .c .k { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .detail .c .v { font-size:20px; font-weight:640; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .detail .c .v small { font-size:11px; font-weight:500; color:var(--muted); margin-left:3px; letter-spacing:0; }
  .detail .ph { color:var(--muted); font-size:12.5px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:7px; vertical-align:1px; }

  /* ---- 工具条 ---- */
  .tools { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .tools button {
    font:inherit; font-size:12.5px;
    padding:7px 14px; border-radius:9px; cursor:pointer;
    border:1px solid var(--hair); background:var(--surface); color:var(--ink-2);
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .tools button:hover { background:var(--hover); }
  .tools button[aria-pressed="true"] {
    border-color:var(--focus); color:var(--focus); background:var(--surface);
  }
  .tools .sep { flex:1; }
  .tools .hint { font-size:12px; color:var(--muted); }

  /* ---- 图例 ---- */
  .legend { display:flex; gap:20px; flex-wrap:wrap; margin-top:18px; padding-top:16px; border-top:1px solid var(--hair); }
  .legend button {
    display:inline-flex; align-items:center; gap:8px;
    font:inherit; font-size:12px; color:var(--ink-2);
    background:none; border:0; padding:0; cursor:pointer; transition:opacity .18s ease;
  }
  .legend button[aria-pressed="false"] { opacity:.34; }
  .legend i { width:11px; height:11px; border-radius:3px; }
  .legend i.line { width:17px; height:2.5px; border-radius:2px; }

  /* ---- 数据表 ---- */
  details { margin-top:22px; }
  summary { cursor:pointer; font-size:12px; color:var(--muted); list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; color:var(--faint); }
  details[open] summary::before { content:"▾ "; }
  table.data {
    width:100%; margin-top:14px; border-collapse:separate; border-spacing:0;
    font-variant-numeric:tabular-nums; font-size:12.5px;
    background:var(--surface); border:1px solid var(--hair); border-radius:12px; overflow:hidden;
  }
  .data th, .data td { height:48px; padding:0 16px; text-align:right; border:0;
                       box-shadow:inset 0 -1px 0 var(--hair); }
  .data th:first-child, .data td:first-child { text-align:left; }
  .data thead th { background:var(--sunken); color:var(--muted); font-size:11px; font-weight:560; }
  .data tbody tr { transition:background .14s ease; }
  .data tbody tr:hover { background:var(--hover); }
  .data tbody tr[aria-selected="true"] { background:var(--accent-soft); }
  .data td:last-child { font-weight:600; color:var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:680px) { body { padding:28px 18px 40px; } .card, .detail { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<div class="page">

  <!-- 结论式标题：说的是发现，不是"某图" -->
  <header class="head">
    <h1 class="finding" id="finding">三类 USB 异常的共同走势</h1>
    <p class="subtitle" id="subtitle">2026-08-01 起 14 天 · 柱为每日各类次数（堆叠），线为当日平均段高</p>
  </header>

  <div class="card">
    <div class="chart-wrap" id="chart">
      <div class="tip" id="tip"></div>
    </div>
    <div class="xlab" id="xlab"></div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="detail" id="detail"><span class="ph">点击任意柱子，查看当天三类的分项数字。</span></div>

  <div class="tools">
    <button id="clear">清除选择</button>
    <span class="sep"></span>
    <span class="hint" id="hint">悬停读数 · 点击选中 · ← → 移动 · Esc 清除</span>
  </div>

  <details>
    <summary>数据表（图表的文字等价物）</summary>
    <table class="data" id="tbl">
      <thead><tr>
        <th>日期</th><th id="th1">—</th><th id="th2">—</th><th id="th3">—</th><th>合计</th><th>平均</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </details>

  <p class="source">数据为模拟生成，仅用于演示图表结构 · 单位：次 / 天</p>
</div>

<script>
(function () {
  'use strict';

  var SERIES = [
    { key:'a', name:'USB 断开', color:'var(--seg-3)' },
    { key:'b', name:'传输错误', color:'var(--seg-2)' },
    { key:'c', name:'供电欠压', color:'var(--seg-1)' }
  ];
  var DAYS = 14;
  function day0() { return Date.parse('2026-08-01T00:00:00Z'); }

  function genData() {
    var out = [];
    for (var i = 0; i < DAYS; i++) {
      var a = 7 + Math.round(Math.sin(i / 2) * 3 + 3);
      var b = 5 + Math.round(Math.cos(i / 3) * 2 + 2);
      var c = 3 + Math.round(Math.sin(i / 1.7) * 2 + 2);
      if (i >= 4 && i <= 6)  { a += 21 - Math.abs(i - 5) * 5; b += 6; }   // 第一次：断开为主
      if (i >= 10 && i <= 12) { c += 19 - Math.abs(i - 11) * 5; b += 8; } // 第二次：欠压为主
      out.push({ i:i, t: day0() + i * 864e5, a:Math.max(0,a), b:Math.max(0,b), c:Math.max(0,c) });
    }
    return out;
  }

  var RAW = genData();
  var state = { hidden:{}, selected:null, hover:null };

  function visible() { return SERIES.filter(function (s) { return !state.hidden[s.key]; }); }
  // 数值卫生：非有限或负值归零（skill §9）
  function safe(v) { return (typeof v === 'number' && isFinite(v) && v >= 0) ? v : 0; }

  function totals() {
    var vis = visible();
    return RAW.map(function (r) {
      var seg = vis.map(function (s) { return { key:s.key, v:safe(r[s.key]) }; });
      var sum = seg.reduce(function (n, x) { return n + x.v; }, 0);
      return { i:r.i, t:r.t, seg:seg, total:sum, avg: vis.length ? sum / vis.length : 0 };
    });
  }

  var VB_W = 1000, VB_H = 300, PL = 58, PR = 76, PT = 30, PB = 26;
  var GAP = 0.42;                     // 柱间留缝：让节奏可读

  function fmtDay(t) { var d = new Date(t); return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日'; }
  function fmtLong(t) { return new Date(t).toISOString().slice(0, 10); }
  function colorOf(k) { for (var i=0;i<SERIES.length;i++) if (SERIES[i].key===k) return SERIES[i].color; return 'var(--muted)'; }

  function render() {
    var data = totals(), vis = visible();

    // 柱的面积代表数量 → Y 轴必须从 0；折线与柱同量纲，共用这条轴（skill §10）
    var maxV = 0;
    data.forEach(function (d) { maxV = Math.max(maxV, d.total, d.avg); });
    var hi = maxV > 0 ? maxV * 1.14 : 1;

    var plotW = VB_W - PL - PR, plotH = VB_H - PT - PB;
    var slot = plotW / Math.max(1, data.length);
    var barW = slot * (1 - GAP);
    var X = function (i) { return PL + slot * i + slot / 2; };
    var Y = function (v) { return PT + plotH - (v / hi) * plotH; };
    var R = 5;                        // 柱顶圆角：4–6px 才看得出是"设计过的"

    var out = [];

    // 选中带：比背景只深一点点，不抢数据
    if (state.selected !== null && data[state.selected]) {
      out.push('<rect x="' + (PL + slot*state.selected).toFixed(1) + '" y="' + (PT-10) +
        '" width="' + slot.toFixed(1) + '" height="' + (plotH+16) + '" rx="6" fill="var(--accent-soft)"/>');
    } else if (state.hover !== null && data[state.hover]) {
      out.push('<rect x="' + (PL + slot*state.hover).toFixed(1) + '" y="' + (PT-10) +
        '" width="' + slot.toFixed(1) + '" height="' + (plotH+16) + '" rx="6" fill="var(--hover)"/>');
    }

    // 网格：只有三条，且淡到几乎看不见 —— 层次是 数据 > 轴 > 网格
    var ticks = [];
    for (var g = 0; g <= 3; g++) {
      var v = (hi * g) / 3, py = Math.round(Y(v)) + .5;
      out.push('<line x1="' + PL + '" y1="' + py + '" x2="' + (VB_W-PR) + '" y2="' + py +
        '" stroke="' + (g === 0 ? 'var(--hair)' : 'var(--grid)') + '" stroke-width="1"/>');
      ticks.push({ v:v, top:(py / VB_H) * 100 });
    }

    // 堆叠柱：从 0 累积；底部两段直角、顶段圆角
    data.forEach(function (d) {
      var x = X(d.i) - barW/2, acc = 0;
      d.seg.forEach(function (s, si) {
        var y0 = Y(acc), y1 = Y(acc + s.v), h = y0 - y1;
        if (h > .5) {
          var isTop = si === d.seg.length - 1;
          var isBot = si === 0;
          out.push('<path data-i="' + d.i + '" d="' + barPath(x, y1, barW, h, R, isTop, isBot) +
            '" fill="' + colorOf(s.key) + '"/>');
        }
        acc += s.v;
      });
    });

    // 折线：画在柱心，线细而准
    if (vis.length && data.length) {
      var pts = data.map(function (d) { return X(d.i).toFixed(1) + ' ' + Y(d.avg).toFixed(1); });
      if (pts.length > 1) {
        out.push('<path d="M' + pts.join(' L') + '" fill="none" stroke="var(--accent)" stroke-width="1.75" ' +
          'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
      }
      data.forEach(function (d) {
        var sel = state.selected === d.i;
        out.push('<circle data-i="' + d.i + '" data-key="__avg" cx="' + X(d.i).toFixed(1) + '" cy="' + Y(d.avg).toFixed(1) +
          '" r="' + (sel ? 4.6 : 3.1) + '" fill="var(--accent)" stroke="var(--surface)" stroke-width="' + (sel ? 2.4 : 1.6) + '"/>');
      });
    }

    // 整柱命中区（细段也点得中）
    data.forEach(function (d) {
      out.push('<rect data-i="' + d.i + '" x="' + (X(d.i)-slot/2).toFixed(1) + '" y="0" width="' +
        slot.toFixed(1) + '" height="' + VB_H + '" fill="transparent"/>');
    });

    var host = document.getElementById('chart');
    var old = host.querySelector('svg'); if (old) old.remove();
    var oldY = host.querySelector('.ylab'); if (oldY) oldY.remove();
    var oldE = host.querySelectorAll('.endlabel'); oldE.forEach(function (n) { n.remove(); });

    host.insertAdjacentHTML('afterbegin',
      '<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" preserveAspectRatio="none" role="img" aria-label="' + aria(data) + '">' +
      out.join('') + '</svg>' +
      '<div class="ylab">' + ticks.map(function (t) {
        return '<span style="top:' + t.top.toFixed(2) + '%">' + Math.round(t.v) + '</span>';
      }).join('') + '</div>');

    // 折线末端的直接标注：读图的人不必回头找图例
    if (vis.length && data.length) {
      var last = data[data.length - 1];
      var topPct = (Y(last.avg) / VB_H) * 100;
      host.insertAdjacentHTML('beforeend',
        '<span class="endlabel" style="right:6px; top:' + topPct.toFixed(2) + '%">平均 ' + last.avg.toFixed(1) + '</span>');
    }

    document.getElementById('xlab').innerHTML = data.length
      ? '<span>' + fmtDay(data[0].t) + '</span><span>' + fmtDay(data[Math.floor(data.length/2)].t) + '</span><span>' + fmtDay(data[data.length-1].t) + '</span>'
      : '';

    // 结论标题随数据更新：说的是发现，不是"某图"
    var peak = data.reduce(function (a, b) { return b.total > a.total ? b : a; }, data[0]);
    document.getElementById('finding').innerHTML =
      '第 <em>' + (peak.i + 1) + '</em> 天异常最高，共 ' + peak.total.toLocaleString() + ' 次';
    document.getElementById('subtitle').textContent =
      fmtLong(data[0].t) + ' 起 ' + data.length + ' 天 · 柱为每日各类次数（堆叠），线为当日平均段高';

    renderLegend(); renderDetail(data); renderTable(data);
  }

  // 顶部圆角、底部直角，让堆叠看起来是一根柱子而不是三个方块
  function barPath(x, y, w, h, r, roundTop, squareBottom) {
    var rr = Math.min(r, w/2, h);
    var t = roundTop
      ? 'M' + x + ' ' + (y+rr) + ' Q' + x + ' ' + y + ' ' + (x+rr) + ' ' + y +
        ' L' + (x+w-rr) + ' ' + y + ' Q' + (x+w) + ' ' + y + ' ' + (x+w) + ' ' + (y+rr)
      : 'M' + x + ' ' + y + ' L' + (x+w) + ' ' + y;
    return t + ' L' + (x+w) + ' ' + (y+h) + ' L' + x + ' ' + (y+h) + ' Z';
  }

  function aria(data) {
    if (!data.length) return '无数据';
    var p = data.reduce(function (a,b) { return b.total > a.total ? b : a; }, data[0]);
    return '堆叠柱状图，' + data.length + ' 天，最高为第 ' + (p.i+1) + ' 天共 ' + p.total + ' 次；折线为平均段高';
  }

  function renderLegend() {
    document.getElementById('legend').innerHTML =
      SERIES.map(function (s) {
        var on = !state.hidden[s.key];
        return '<button data-legend="' + s.key + '" aria-pressed="' + on + '"><i style="background:' + s.color + '"></i>' + s.name + '</button>';
      }).join('') +
      '<button data-legend="__avg" aria-pressed="true"><i class="line" style="background:var(--accent)"></i>平均段高</button>';
  }

  function renderDetail(data) {
    var el = document.getElementById('detail');
    if (state.selected === null || !data[state.selected]) {
      el.innerHTML = '<span class="ph">点击任意柱子，查看当天三类的分项数字。</span>';
      return;
    }
    var d = data[state.selected];
    var cells = d.seg.map(function (s) {
      var m = null; SERIES.forEach(function (x) { if (x.key === s.key) m = x; });
      return '<div class="c"><div class="k"><span class="dot" style="background:' + m.color + '"></span>' + m.name +
        '</div><div class="v">' + s.v + '<small>次</small></div></div>';
    }).join('');
    el.innerHTML =
      '<div class="t">' + fmtLong(d.t) + '　第 ' + (d.i+1) + ' 天</div>' +
      '<div class="row">' + cells +
      '<div class="c"><div class="k">合计</div><div class="v">' + d.total.toLocaleString() + '<small>次</small></div></div>' +
      '<div class="c"><div class="k"><span class="dot" style="background:var(--accent)"></span>平均段高</div>' +
      '<div class="v">' + d.avg.toFixed(1) + '<small>次</small></div></div></div>';
  }

  function renderTable(data) {
    SERIES.forEach(function (s, i) { document.getElementById('th' + (i+1)).textContent = s.name; });
    document.getElementById('tbody').innerHTML = data.map(function (d) {
      var cells = ['a','b','c'].map(function (k) {
        var s = null; d.seg.forEach(function (x) { if (x.key === k) s = x; });
        return '<td>' + (s ? s.v.toLocaleString() : '—') + '</td>';
      }).join('');
      return '<tr' + (state.selected === d.i ? ' aria-selected="true"' : '') + '><td>' + fmtLong(d.t) + '</td>' +
        cells + '<td>' + d.total.toLocaleString() + '</td><td>' + d.avg.toFixed(1) + '</td></tr>';
    }).join('');
  }

  // ---------------------------------------------------------------- 交互
  function idxAt(e) {
    var svg = document.getElementById('chart').querySelector('svg');
    if (!svg) return null;
    var box = svg.getBoundingClientRect();
    var plotW = VB_W - PL - PR, slot = plotW / RAW.length;
    var vx = ((e.clientX - box.left) / box.width) * VB_W;
    var i = Math.floor((vx - PL) / slot);
    return (i < 0 || i >= RAW.length) ? null : i;
  }

  var chart = document.getElementById('chart'), tip = document.getElementById('tip');

  chart.addEventListener('mousemove', function (e) {
    var i = idxAt(e);
    if (i === null) { tip.style.display = 'none'; if (state.hover !== null) { state.hover = null; render(); } return; }
    if (state.hover !== i) { state.hover = i; render(); }

    var d = totals()[i];
    tip.innerHTML = '<div class="d">' + fmtLong(d.t) + '</div>' +
      d.seg.map(function (s) {
        var m = null; SERIES.forEach(function (x) { if (x.key === s.key) m = x; });
        return '<div class="r"><i style="background:' + m.color + '"></i>' + m.name + '<b>' + s.v + '</b></div>';
      }).join('') +
      '<div class="r" style="margin-top:5px"><i style="background:var(--accent)"></i>平均段高<b>' + d.avg.toFixed(1) + '</b></div>' +
      '<div class="r"><i style="background:transparent"></i>合计<b>' + d.total + '</b></div>';
    tip.style.display = '';

    var box = chart.getBoundingClientRect(), svgBox = chart.querySelector('svg').getBoundingClientRect();
    var px = ((PL + (VB_W - PL - PR) / RAW.length * (i + .5)) / VB_W) * svgBox.width;
    tip.style.left = Math.max(8, Math.min(box.width - tip.offsetWidth - 8, px + 16)).toFixed(0) + 'px';
    tip.style.top = '6px';
  });

  chart.addEventListener('mouseleave', function () {
    tip.style.display = 'none';
    if (state.hover !== null) { state.hover = null; render(); }
  });

  // 点击：选中并保持（与悬停是两个独立样式）
  chart.addEventListener('click', function (e) {
    var i = idxAt(e);
    state.selected = (i === null || state.selected === i) ? null : i;
    render();
  });

  document.getElementById('clear').addEventListener('click', function () { state.selected = null; render(); });

  document.getElementById('legend').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-legend]'); if (!b) return;
    var k = b.getAttribute('data-legend');
    if (k === '__avg') return;                       // 平均线始终显示
    if (k === '__all') { state.hidden = {}; }
    else {
      state.hidden[k] = !state.hidden[k];
      if (SERIES.every(function (s) { return state.hidden[s.key]; })) state.hidden = {};  // 不留空图
    }
    render();
  });

  document.getElementById('tbody').addEventListener('click', function (e) {
    var tr = e.target.closest('tr'); if (!tr) return;
    var i = Array.prototype.indexOf.call(tr.parentNode.children, tr);
    state.selected = (state.selected === i) ? null : i;
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { state.selected = null; render(); return; }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    var step = e.key === 'ArrowRight' ? 1 : -1;
    if (state.selected === null) state.selected = step > 0 ? 0 : RAW.length - 1;
    else state.selected = Math.max(0, Math.min(RAW.length - 1, state.selected + step));
    render();
    e.preventDefault();
  });

  render();
})();
</script>
</body>
</html>

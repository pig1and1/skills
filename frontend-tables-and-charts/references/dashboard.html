<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>车辆 USB 日志分析仪表盘</title>
<style>
  :root {
    --bg:#fafbfc; --fg:#1c1e26; --muted:#6b7280; --card:#fff;
    --table-border: color-mix(in srgb, currentColor 12%, transparent);
    --table-header-bg:#fff; --table-header-fg:#55596b;
    --table-row-hover:#f5f6f8; --table-row-selected:#e8f0fe; --table-focus:#3b6cf6;
    --good:#15803d; --warn:#a16207; --bad:#b91c1c;
    --chart-grid: color-mix(in srgb, currentColor 10%, transparent);
    --chart-label:#8a94a6; --chart-line:#4f7cf6; --chart-band:#4f7cf6;
    --chart-bar:#e0684b; --chart-alt:#14a3a3;
    --sel: color-mix(in srgb, #4f7cf6 16%, transparent);
    --brush-fill: color-mix(in srgb, #4f7cf6 12%, transparent);
    --a1:#4f7cf6; --a2:#e0684b; --a3:#c99a2e; --a4:#8b5cf6; --a5:#14a3a3; --a6:#8a94a6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#101114; --fg:#e6e8ee; --muted:#9aa0b0; --card:#17181c;
      --table-header-bg:#17181c; --table-header-fg:#9aa0b0;
      --table-row-hover:#1f2126; --table-row-selected:#1d2b45; --table-focus:#6d92ff;
      --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
      --chart-grid: color-mix(in srgb, currentColor 14%, transparent);
      --chart-label:#7d8798; --chart-line:#6b93ff; --chart-band:#6b93ff;
      --chart-bar:#f07f63; --chart-alt:#2dd4bf;
      --sel: color-mix(in srgb, #6b93ff 18%, transparent);
      --brush-fill: color-mix(in srgb, #6b93ff 14%, transparent);
      --a1:#6b93ff; --a2:#f07f63; --a3:#e0b44a; --a4:#a78bfa; --a5:#2dd4bf; --a6:#9aa4b6;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:13px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  h1 { font-size:19px; margin:0 0 2px; }
  h2 { font-size:13px; margin:0 0 6px; color:var(--muted); font-weight:550; letter-spacing:.02em; }
  .sub { color:var(--muted); margin:0 0 14px; max-width:92ch; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  button { font:inherit; padding:5px 11px; border:1px solid var(--table-border);
           border-radius:6px; background:var(--card); color:inherit; cursor:pointer; }
  button:hover { background:var(--table-row-hover); }
  button[aria-pressed="true"] { background:var(--table-row-selected); border-color:var(--table-focus); }
  .hint { color:var(--muted); font-size:12px; }

  /* KPI */
  .cards { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--table-border); border-radius:10px;
          padding:9px 13px; min-width:126px; }
  .card .k { color:var(--muted); font-size:11px; }
  .card .v { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:1px; }
  .card .n { color:var(--muted); font-size:11px; }

  /* 图表容器：高度固定 → 加载不推挤页面（CLS ≈ 0） */
  figure { margin:0 0 16px; background:var(--card); border:1px solid var(--table-border);
           border-radius:10px; padding:11px 13px 7px; }
  .chart-wrap { position:relative; contain:layout paint; }
  .chart-wrap svg { display:block; width:100%; height:100%; }
  .ylabels { position:absolute; left:0; top:0; bottom:0; width:52px; pointer-events:none; }
  .ylabels span { position:absolute; right:7px; transform:translateY(-50%); font-size:11px;
                  color:var(--chart-label); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }

  /* tooltip 与十字准线 */
  .crosshair { position:absolute; top:0; bottom:0; width:1px; background:var(--chart-line);
               opacity:.55; pointer-events:none; display:none; }
  .tip { position:absolute; pointer-events:none; display:none; z-index:5;
         background:var(--card); border:1px solid var(--table-border); border-radius:7px;
         padding:6px 9px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.14); white-space:nowrap; }
  .tip b { font-variant-numeric:tabular-nums; }

  /* 骨架：与真实内容同高同列宽 */
  .skeleton { position:absolute; inset:0; display:none; padding:8px 0; }
  .skeleton.on { display:block; }
  .skeleton i { display:block; height:10px; border-radius:4px; margin:9px 0;
                background:color-mix(in srgb, currentColor 9%, transparent);
                animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .skeleton i { animation:none } }

  /* 空态 */
  .empty { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
           color:var(--muted); font-size:12px; }
  .empty.on { display:flex; }

  /* 表格 */
  .table-scroll { scrollbar-gutter:stable; overflow:auto; contain:layout paint;
                  max-height:420px; border:1px solid var(--table-border);
                  border-radius:10px; background:var(--card); }
  table.data-table { table-layout:fixed; width:100%; border-collapse:separate; border-spacing:0;
                     font-variant-numeric:tabular-nums; }
  .data-table th, .data-table td { height:34px; padding:0 11px; text-align:left;
      vertical-align:middle; border:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .data-table thead th { position:sticky; top:0; z-index:2; background:var(--table-header-bg);
      color:var(--table-header-fg); font-size:11px; font-weight:550; letter-spacing:.03em;
      box-shadow:inset 0 -1px 0 var(--table-border); }
  .data-table tbody tr { box-shadow:inset 0 -1px 0 var(--table-border); }
  .data-table tbody tr:hover { background:var(--table-row-hover); }
  .num { text-align:right; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  code { background:color-mix(in srgb, currentColor 8%, transparent); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>

<h1>车辆 USB 日志分析仪表盘</h1>
<p class="sub">
  5000 条原始事件。<strong>在主图上拖拽</strong>选择时间窗，下面所有视图与表格会一起过滤；双击清除。
  图表按小时降采样绘制，表格仍是逐条原始记录。
</p>

<div class="toolbar">
  <button id="reset" aria-pressed="false">清除选择</button>
  <button id="toggle-avg" aria-pressed="true">7 日均线</button>
  <button id="reload">模拟重新加载</button>
  <span class="hint" id="hint">—</span>
</div>

<div class="cards" id="kpis"></div>

<figure>
  <h2>分数时间线 · 每小时均值（拖拽选择 · hover 查看 · 双击清除）</h2>
  <div class="chart-wrap" id="c-main" style="height:230px">
    <div class="crosshair" id="cross-main"></div>
    <div class="tip" id="tip-main"></div>
    <div class="skeleton" id="sk-main"><i style="width:92%"></i><i style="width:78%"></i><i style="width:86%"></i><i style="width:64%"></i><i style="width:88%"></i></div>
    <div class="empty" id="em-main">所选区间内没有数据</div>
  </div>
</figure>

<div class="grid2">
  <figure>
    <h2>异常类型构成</h2>
    <div class="chart-wrap" id="c-kinds" style="height:170px">
      <div class="tip" id="tip-kinds"></div>
      <div class="empty" id="em-kinds">无异常记录</div>
    </div>
  </figure>
  <figure>
    <h2>分数分布</h2>
    <div class="chart-wrap" id="c-hist" style="height:170px">
      <div class="tip" id="tip-hist"></div>
      <div class="empty" id="em-hist">无数据</div>
    </div>
  </figure>
</div>

<figure>
  <h2>原始记录（虚拟滚动 · 随选择联动）</h2>
  <div class="table-scroll" id="tbl" style="height:380px">
    <table class="data-table">
      <colgroup>
        <col style="width:150px"><col style="width:96px"><col style="width:150px"><col>
      </colgroup>
      <thead><tr>
        <th scope="col">时间</th>
        <th scope="col" class="num">分数</th>
        <th scope="col">异常类型</th>
        <th scope="col">说明</th>
      </tr></thead>
    </table>
    <div class="vspacer" id="tbl-spacer" style="position:relative">
      <table class="data-table" id="tbl-body" style="position:absolute;top:0;left:0;width:100%">
        <colgroup>
          <col style="width:150px"><col style="width:96px"><col style="width:150px"><col>
        </colgroup>
        <tbody id="tbl-rows"></tbody>
      </table>
    </div>
  </div>
</figure>

<footer style="color:var(--muted);font-size:12px;max-width:92ch">
  数据为模拟。图表 ≤ 1–2k 点用内联 SVG；表格 5000 行走<strong>固定行高虚拟滚动</strong>；
  两个分布图与主图<strong>共享过滤状态</strong>；所有容器高度在数据到达前已固定（骨架屏同高）。
</footer>

<script>
(function () {
  'use strict';

  var KINDS = ['USB 断开', '传输错误', '供电欠压', '枚举失败', '校验失败', '通信超时'];
  var KIND_COLOR = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)', 'var(--a5)', 'var(--a6)'];
  var DAYS = 30, N = 5000, HOUR = 36e5, DAY = 864e5;
  var T0 = Date.parse('2026-08-01T00:00:00Z');

  // ================================================================ 数据
  function genData() {
    var rows = [];
    for (var i = 0; i < N; i++) {
      var t = T0 + Math.random() * DAYS * DAY;
      var day = (t - T0) / DAY;
      var stress = 0;
      if (day > 8 && day < 11) stress = 0.85;
      else if (day > 18 && day < 20.5) stress = 0.6;
      else if (day > 25 && day < 27) stress = 0.4;
      var score = 94 - stress * 30 - Math.random() * 6;
      if (Math.random() < stress * 0.7) score -= 10 + Math.random() * 15;
      var kind = null;
      if (Math.random() < stress * 0.55 || Math.random() < 0.02) {
        kind = KINDS[Math.floor(Math.random() * (stress > 0.5 ? 4 : 6))];
      }
      rows.push({ t: t, score: Math.max(20, Math.min(100, score)), kind: kind });
    }
    rows.sort(function (a, b) { return a.t - b.t; });
    return rows;
  }

  // 按小时降采样：5000 条原始点画不出来，也不必画
  function hourly(rows) {
    var map = new Map();
    rows.forEach(function (r) {
      var k = Math.floor((r.t - T0) / HOUR);
      var b = map.get(k);
      if (!b) { b = { k: k, t: T0 + k * HOUR, sum: 0, n: 0 }; map.set(k, b); }
      b.sum += r.score; b.n++;
    });
    return Array.from(map.values())
      .sort(function (a, b) { return a.k - b.k; })
      .map(function (b) { return { t: b.t, avg: b.sum / b.n, n: b.n }; });
  }

  function movingAverage(points, win) {
    var out = [], sum = 0;
    for (var i = 0; i < points.length; i++) {
      sum += points[i].avg;
      if (i >= win) sum -= points[i - win].avg;
      out.push({ t: points[i].t, v: sum / Math.min(i + 1, win) });
    }
    return out;
  }

  function byKind(rows) {
    var c = KINDS.map(function () { return 0; });
    rows.forEach(function (r) { if (r.kind) c[KINDS.indexOf(r.kind)]++; });
    return c;
  }

  function histogram(values) {
    var bins = new Array(10).fill(0), lo = 20, hi = 100, w = (hi - lo) / 10;
    values.forEach(function (v) { bins[Math.min(9, Math.max(0, Math.floor((v - lo) / w)))]++; });
    return bins.map(function (n, i) { return { from: lo + i * w, to: lo + (i + 1) * w, n: n }; });
  }

  // ================================================================ 状态
  var ALL = [];
  var state = { range: null, showAvg: true, loading: false };

  function selected() {
    if (!state.range) return ALL;
    var a = state.range[0], b = state.range[1];
    return ALL.filter(function (r) { return r.t >= a && r.t <= b; });
  }

  // ================================================================ SVG 基元
  function fmtTime(t) {
    var d = new Date(t);
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' +
      String(d.getUTCHours()).padStart(2, '0') + ':00';
  }

  // 折线图：自适应 Y 域（折线只表达位置与趋势）
  function drawTimeline(mount, points, opts) {
    var W = 1000, H = 230, PT = 14, PB = 22, PR = 8, PL = 0;
    var plotH = H - PT - PB, plotW = W - PL - PR;
    var ys = points.map(function (p) { return p.avg; });
    var mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
    var pad = (mx - mn) * 0.18 || 1, lo = mn - pad, hi = mx + pad;
    var inner = { left: 52, right: W - PR };
    var iw = inner.right - inner.left;
    var x = function (t) { return inner.left + ((t - points[0].t) / Math.max(1, points[points.length - 1].t - points[0].t)) * iw; };
    var y = function (v) { return PT + plotH - ((v - lo) / (hi - lo)) * plotH; };

    var out = [];
    out.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" id="hit"></rect>');
    for (var g = 0; g <= 3; g++) {
      var v = lo + ((hi - lo) * g) / 3, py = Math.round(y(v)) + 0.5;
      out.push('<line x1="' + inner.left + '" y1="' + py + '" x2="' + inner.right + '" y2="' + py + '" stroke="var(--chart-grid)" stroke-width="1"/>');
    }
    var area = 'M' + points.map(function (p) { return x(p.t).toFixed(1) + ' ' + y(p.avg).toFixed(1); }).join(' L');
    out.push('<path d="' + area + ' L' + inner.right + ' ' + (PT + plotH) + ' L' + inner.left + ' ' + (PT + plotH) + ' Z" fill="var(--chart-band)" opacity="0.10"/>');
    out.push('<path d="' + area + '" fill="none" stroke="var(--chart-band)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');

    if (opts.showAvg && points.length > 12) {
      var ma = movingAverage(points, 24);
      var path = 'M' + ma.map(function (p) { return x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' L');
      out.push('<path d="' + path + '" fill="none" stroke="var(--chart-alt)" stroke-width="1.6" stroke-dasharray="5 3" vector-effect="non-scaling-stroke" opacity="0.9"/>');
    }

    // X 轴刻度
    var ticks = [], step = Math.max(1, Math.round(points.length / 6));
    for (var i = 0; i < points.length; i += step) {
      ticks.push({ x: x(points[i].t), label: fmtTime(points[i].t) });
    }

    mount.insertAdjacentHTML('afterbegin',
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="分数时间线，' + points.length + ' 个时间点，均值 ' +
      (ys.reduce(function (a, b) { return a + b; }, 0) / ys.length).toFixed(1) + '">' +
      out.join('') +
      '<rect id="brush" x="0" y="0" width="0" height="' + H + '" fill="var(--brush-fill)" stroke="var(--chart-line)" stroke-width="1" style="display:none"/>' +
      '</svg>' +
      '<div class="ylabels">' + [0, 1, 2, 3].map(function (g) {
        var v = lo + ((hi - lo) * g) / 3;
        return '<span style="top:' + ((y(v) / H) * 100).toFixed(2) + '%">' + v.toFixed(0) + '</span>';
      }).join('') + '</div>');

    return { x: x, y: y, W: W, H: H, ticks: ticks };
  }

  // 水平柱状：数值轴必须从 0
  function drawBars(mount, items, opts) {
    var W = 480, H = 170, PL = 78, PR = 40, PT = 6, PB = 6;
    var rowH = (H - PT - PB) / Math.max(1, items.length);
    var max = Math.max.apply(null, items.map(function (i) { return i.n; })) || 1;
    var out = [];
    items.forEach(function (it, i) {
      var y = PT + i * rowH;
      var w = (it.n / max) * (W - PL - PR);
      out.push('<rect x="' + PL + '" y="' + (y + rowH * 0.18).toFixed(1) + '" width="' + Math.max(0, w).toFixed(1) +
        '" height="' + (rowH * 0.64).toFixed(1) + '" fill="' + it.color + '" rx="2"/>');
      out.push('<text x="' + (PL - 8) + '" y="' + (y + rowH / 2).toFixed(1) + '" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--chart-label)">' + it.label + '</text>');
      out.push('<text x="' + (PL + w + 6).toFixed(1) + '" y="' + (y + rowH / 2).toFixed(1) + '" dominant-baseline="middle" font-size="11" fill="var(--chart-label)">' + it.n + '</text>');
    });
    mount.insertAdjacentHTML('afterbegin',
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMinYMid meet" role="img" ' +
      'aria-label="异常类型分布">' + out.join('') + '</svg>');
  }

  // 直方图：柱状 → 从 0
  function drawHist(mount, bins) {
    var W = 480, H = 170, PT = 8, PB = 22, PL = 8, PR = 8;
    var plotH = H - PT - PB, plotW = W - PL - PR;
    var max = Math.max.apply(null, bins.map(function (b) { return b.n; })) || 1;
    var bw = plotW / bins.length;
    var out = [];
    bins.forEach(function (b, i) {
      var h = (b.n / max) * plotH;
      out.push('<rect x="' + (PL + i * bw + 1).toFixed(1) + '" y="' + (PT + plotH - h).toFixed(1) +
        '" width="' + (bw - 2).toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--chart-bar)" rx="1"/>');
    });
    for (var g = 0; g <= 2; g++) {
      var py = Math.round(PT + (plotH * g) / 2) + 0.5;
      out.push('<line x1="' + PL + '" y1="' + py + '" x2="' + (W - PR) + '" y2="' + py + '" stroke="var(--chart-grid)" stroke-width="1"/>');
    }
    out.push('<text x="' + PL + '" y="' + (H - 6) + '" font-size="11" fill="var(--chart-label)">20 分</text>');
    out.push('<text x="' + (W - PR) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="var(--chart-label)">100 分</text>');
    mount.insertAdjacentHTML('afterbegin',
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="分数分布直方图">' + out.join('') + '</svg>');
  }

  // ================================================================ 渲染
  var el = function (id) { return document.getElementById(id); };
  function clearChart(mount) {
    var svg = mount.querySelector('svg');
    if (svg) svg.remove();
    var yl = mount.querySelector('.ylabels');
    if (yl) yl.remove();
  }

  var mainGeom = null;

  function render() {
    var rows = selected();

    // KPI
    var scores = rows.map(function (r) { return r.score; });
    var avg = scores.length ? scores.reduce(function (a, b) { return a + b; }, 0) / scores.length : 0;
    var anomalies = rows.filter(function (r) { return r.kind; }).length;
    var worst = rows.reduce(function (a, r) { return (!a || r.score < a.score) ? r : a; }, null);
    el('kpis').innerHTML =
      card('记录数', rows.length.toLocaleString(), state.range ? '已按选择过滤' : '全部 ' + N.toLocaleString()) +
      card('平均分', avg.toFixed(1), scores.length + ' 条参与') +
      card('异常记录', anomalies.toLocaleString(), rows.length ? (anomalies / rows.length * 100).toFixed(1) + '%' : '—') +
      card('最低分', worst ? worst.score.toFixed(1) : '—', worst ? fmtTime(worst.t) : '无数据');

    var pts = hourly(rows);

    // 主图
    clearChart(el('c-main'));
    el('em-main').classList.toggle('on', pts.length === 0);
    if (pts.length) {
      mainGeom = drawTimeline(el('c-main'), pts);
      el('hint').textContent = pts.length + ' 个小时点 · ' + rows.length.toLocaleString() + ' 条记录' +
        (state.range ? ' · 已选择 ' + fmtTime(state.range[0]) + ' → ' + fmtTime(state.range[1]) : '');
    } else { mainGeom = null; el('hint').textContent = '所选区间无数据'; }

    // 异常构成
    clearChart(el('c-kinds'));
    var counts = byKind(rows);
    var items = KINDS.map(function (k, i) { return { label: k, n: counts[i], color: KIND_COLOR[i] }; })
      .filter(function (i) { return i.n > 0; })
      .sort(function (a, b) { return b.n - a.n; });
    el('em-kinds').classList.toggle('on', items.length === 0);
    if (items.length) drawBars(el('c-kinds'), items);

    // 直方图
    clearChart(el('c-hist'));
    el('em-hist').classList.toggle('on', rows.length === 0);
    if (rows.length) drawHist(el('c-hist'), histogram(scores));

    renderTable(rows);
  }

  function card(k, v, n) {
    return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v +
      '</div><div class="n">' + n + '</div></div>';
  }

  // ---------------------------------------------------------------- 虚拟表格
  var ROW_H = 34, OVERSCAN = 6, tableRows = [], scrollTop = 0;

  function renderTable(rows) {
    tableRows = rows;
    el('tbl-spacer').style.height = (rows.length * ROW_H) + 'px';
    paintRows();
  }

  function paintRows() {
    var mount = el('tbl');
    var start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
    var visible = Math.ceil(mount.clientHeight / ROW_H) + OVERSCAN * 2;
    var end = Math.min(tableRows.length, start + visible);
    el('tbl-body').style.top = (start * ROW_H) + 'px';
    var html = '';
    for (var i = start; i < end; i++) {
      var r = tableRows[i];
      html += '<tr><td>' + fmtTime(r.t) + '</td>' +
        '<td class="num" style="color:' + (r.score >= 90 ? 'var(--good)' : r.score >= 75 ? 'var(--warn)' : 'var(--bad)') + '">' +
        r.score.toFixed(1) + '</td>' +
        '<td>' + (r.kind ? '<span class="dot" style="background:' + KIND_COLOR[KINDS.indexOf(r.kind)] + '"></span>' + r.kind : '—') + '</td>' +
        '<td style="color:var(--muted)">' + (r.kind ? '已记录' : '正常采样') + '</td></tr>';
    }
    el('tbl-rows').innerHTML = html;
  }

  var raf = 0;
  el('tbl').addEventListener('scroll', function (e) {
    scrollTop = e.target.scrollTop;
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; paintRows(); });
  }, { passive: true });

  // ---------------------------------------------------------------- brush
  var brushEl = null, brushFrom = null;

  function svgRect(evt) {
    var svg = el('c-main').querySelector('svg');
    var box = svg.getBoundingClientRect();
    return { box: box, px: ((evt.clientX - box.left) / box.width) * mainGeom.W };
  }

  el('c-main').addEventListener('mousedown', function (e) {
    if (!mainGeom || e.target.closest('.tip')) return;
    brushEl = el('c-main').querySelector('#brush');
    brushFrom = svgRect(e).px;
    e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (brushEl && brushFrom !== null) {
      var now = svgRect(e).px;
      brushEl.setAttribute('x', Math.min(brushFrom, now).toFixed(1));
      brushEl.setAttribute('width', Math.abs(now - brushFrom).toFixed(1));
      brushEl.style.display = '';
    }
  });

  window.addEventListener('mouseup', function (e) {
    if (!brushEl || brushFrom === null) return;
    var now = svgRect(e).px;
    var a = Math.min(brushFrom, now), b = Math.max(brushFrom, now);
    brushEl.style.display = 'none';
    brushFrom = null;
    if (Math.abs(b - a) < 6) return;                 // 视为点击，不是选择

    var pts = hourly(selected());
    if (pts.length < 2) return;
    var svg = el('c-main').querySelector('svg');
    var box = svg.getBoundingClientRect();
    var toT = function (px) {
      var f = (px - 52) / (1000 - 8 - 52);
      f = Math.max(0, Math.min(1, f));
      return pts[0].t + f * (pts[pts.length - 1].t - pts[0].t);
    };
    state.range = [toT(a), toT(b)];
    render();
  });

  el('c-main').addEventListener('dblclick', function () {
    state.range = null;
    render();
  });

  // hover：十字准线 + tooltip
  el('c-main').addEventListener('mousemove', function (e) {
    if (!mainGeom || brushFrom !== null) return;
    var pts = hourly(selected());
    if (!pts.length) return;
    var g = svgRect(e);
    var f = Math.max(0, Math.min(1, (g.px - 52) / (1000 - 8 - 52)));
    var t = pts[0].t + f * (pts[pts.length - 1].t - pts[0].t);
    // 找最近的小时点
    var lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (pts[mid].t < t) lo = mid; else hi = mid; }
    var p = Math.abs(pts[lo].t - t) <= Math.abs(pts[hi].t - t) ? pts[lo] : pts[hi];
    var px = (mainGeom.x(p.t) / mainGeom.W) * g.box.width;

    var ch = el('cross-main');
    ch.style.display = ''; ch.style.left = px.toFixed(1) + 'px';
    var tip = el('tip-main');
    tip.style.display = '';
    tip.innerHTML = fmtTime(p.t) + '<br>均值 <b>' + p.avg.toFixed(1) + '</b>　采样 <b>' + p.n + '</b>';
    tip.style.left = Math.min(g.box.width - 150, px + 12).toFixed(1) + 'px';
    tip.style.top = '10px';
  });
  el('c-main').addEventListener('mouseleave', function () {
    el('cross-main').style.display = 'none';
    el('tip-main').style.display = 'none';
  });

  // ---------------------------------------------------------------- 工具条
  el('reset').addEventListener('click', function () { state.range = null; render(); });
  el('toggle-avg').addEventListener('click', function () {
    state.showAvg = !state.showAvg;
    this.setAttribute('aria-pressed', String(state.showAvg));
    render();
  });
  el('reload').addEventListener('click', function () {
    // 加载态：骨架屏与真实内容同高，所以出现和消失都不会推挤页面
    state.loading = true;
    document.querySelectorAll('.skeleton').forEach(function (s) { s.classList.add('on'); });
    el('hint').textContent = '加载中…';
    setTimeout(function () {
      document.querySelectorAll('.skeleton').forEach(function (s) { s.classList.remove('on'); });
      ALL = genData();
      state.loading = false;
      render();
    }, 900);
  });

  // 键盘可达：方向键平移选择窗
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (!el('c-main').contains(document.activeElement) && document.activeElement !== document.body) return;
    var pts = hourly(ALL);
    if (pts.length < 2) return;
    var stepDir = e.key === 'ArrowRight' ? 1 : -1;
    var a = state.range ? state.range[0] : pts[0].t;
    var b = state.range ? state.range[1] : pts[pts.length - 1].t;
    var w = b - a, shift = stepDir * w * 0.15;
    var na = a + shift, nb = b + shift;
    if (na < pts[0].t) { nb += pts[0].t - na; na = pts[0].t; }
    var last = pts[pts.length - 1].t;
    if (nb > last) { na -= nb - last; nb = last; }
    state.range = [na, nb];
    render();
    e.preventDefault();
  });

  // ---------------------------------------------------------------- 启动
  ALL = genData();
  render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>min-width:0 最小复现</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; }
  h2 { font-size: 12px; margin: 16px 0 6px; color: #555; }

  /* 两列栅格。两边完全一样，只有 min-width 不同。 */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
  .row.three { grid-template-columns: 3fr 2fr; }

  .cell { border: 1px solid #bbb; padding: 8px; }
  .cell.fixed { min-width: 0; }

  /* 一个"内容比容器宽"的东西 —— 表格式的不可断行内容，模拟 chart/表格 */
  .wide { white-space: nowrap; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>

<h2>1 · 两等分栅格：左列内容很宽</h2>
<div class="row" id="r1">
  <div class="cell" id="a1"><div class="wide" id="w1"></div></div>
  <div class="cell" id="a2">右列</div>
</div>

<h2>2 · 同样的栅格，左列加了 min-width: 0</h2>
<div class="row" id="r2">
  <div class="cell fixed" id="b1"><div class="wide" id="w2"></div></div>
  <div class="cell" id="b2">右列</div>
</div>

<h2>3 · 3fr / 2fr，左列内容很宽（showcase 的真实结构）</h2>
<div class="row three" id="r3">
  <div class="cell" id="c1"><div class="wide" id="w3"></div></div>
  <div class="cell" id="c2">右列</div>
</div>

<h2>4 · 同上，左列加 min-width: 0</h2>
<div class="row three" id="r4">
  <div class="cell fixed" id="d1"><div class="wide" id="w4"></div></div>
  <div class="cell" id="d2">右列</div>
</div>

<script>
  // Deliberately wider than a 1fr track at 900px (~438px), so `min-width: auto`
  // has a chance to do something. The first attempt used 60 characters (~432px)
  // and measured nothing -- the content has to actually exceed the track.
  const WIDE = 'ERR_CONNECTION_RESET 2026-09-14T20:19:27Z req=14122 err=522 p95=161ms ' +
    'host=api-7f3c.internal region=cn-north-1 retry=3 upstream=gateway-02'
  for (const id of ['w1', 'w2', 'w3', 'w4']) {
    document.getElementById(id).textContent = WIDE
  }

  window.__probe = () => {
    const out = {}
    for (const [name, hostId, wrapId] of [
      ['plain-1fr', 'a1', 'r1'],
      ['fixed-1fr', 'b1', 'r2'],
      ['plain-3fr', 'c1', 'r3'],
      ['fixed-3fr', 'd1', 'r4'],
    ]) {
      const host = document.getElementById(hostId)
      const row = document.getElementById(wrapId)
      const hb = host.getBoundingClientRect()
      const rb = row.getBoundingClientRect()
      out[name] = {
        // Did the grid track overflow the row it lives in?
        rowScroll: row.scrollWidth,
        rowClient: row.clientWidth,
        rowOverflow: row.scrollWidth - row.clientWidth,
        // Is the left track wider than the share it was given?
        hostW: Math.round(hb.width),
        expectedW: Math.round(rb.width / 2),
        // The document itself: does the page scroll sideways?
        docScroll: document.documentElement.scrollWidth,
        docClient: document.documentElement.clientWidth,
      }
    }
    return out
  }
</script>
</body>
</html>

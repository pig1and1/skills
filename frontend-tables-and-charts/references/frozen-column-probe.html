<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>冻结首列：第四条伴随条件是真的吗</title>
<style>
  :root {
    /* 三个颜色**故意拉开**，好让测出来的 rgb 不会因为四舍五入而混淆。 */
    --base:     rgb(255, 255, 255);
    --hover:    rgb(240, 244, 250);
    --selected: rgb(219, 234, 254);
  }
  body {
    margin: 0;
    padding: 24px;
    font: 14px/1.5 system-ui, sans-serif;
    background: rgb(250, 250, 250);
  }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .note { color: #555; margin: 4px 0 12px; max-width: 70ch; }

  table {
    border-collapse: separate;   /* sticky 单元格必须有独立背景，collapse 下会互相抢 */
    border-spacing: 0;
    width: 640px;
    table-layout: fixed;
    background: var(--base);
    box-shadow: 0 0 0 1px #d4d4d8;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #f4f4f5;
    box-shadow: inset 0 -1px 0 #d4d4d8;
  }
  tbody tr[aria-selected="true"] { background: var(--selected); }
  tbody tr:hover                  { background: var(--hover); }

  /* ---- 完整版：四条伴随条件齐全 ---- */
  #t-ok .col-id {
    position: sticky; left: 0; z-index: 1;
    background: var(--base);                      /* 1 不透明 */
    box-shadow: inset -1px 0 0 #d4d4d8;           /* 2 一条右边缘 */
  }
  #t-ok thead .col-id { z-index: 3; }             /* 3 高于粘性表头 */
  #t-ok tbody tr:hover .col-id                  { background: var(--hover); }     /* 4 跟着行状态 */
  #t-ok tbody tr[aria-selected="true"] .col-id  { background: var(--selected); }

  /* ---- 缺第 4 条：静态看一模一样，交互时才露馅 ---- */
  #t-bad .col-id {
    position: sticky; left: 0; z-index: 1;
    background: var(--base);
    box-shadow: inset -1px 0 0 #d4d4d8;
  }
  #t-bad thead .col-id { z-index: 3; }
  /* ← 这里**故意**不写 tr:hover / tr[aria-selected] 的覆盖 */
</style>
</head>
<body>

<h2>① 四条齐全（正文 §1 的修法）</h2>
<p class="note">选中的那一行：冻结格与其余格的底色应当**一致**。</p>
<table id="t-ok">
  <thead><tr><th class="col-id">订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
  <tbody>
    <tr data-row="1"><td class="col-id">A-1001</td><td>甲公司</td><td class="amt">1,200.00</td><td>已付</td></tr>
    <tr data-row="2" aria-selected="true"><td class="col-id">A-1002</td><td>乙公司</td><td class="amt">980.50</td><td>待付</td></tr>
    <tr data-row="3"><td class="col-id">A-1003</td><td>丙公司</td><td class="amt">3,410.00</td><td>已付</td></tr>
  </tbody>
</table>

<h2>② 缺第 4 条（只有不透明底色，没有状态覆盖）</h2>
<p class="note">同一个选中行：冻结格停在 --base，其余格是 --selected。**差别只在有状态时出现**，
所以静态截图看不出来。</p>
<table id="t-bad">
  <thead><tr><th class="col-id">订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
  <tbody>
    <tr data-row="1"><td class="col-id">B-2001</td><td>甲公司</td><td class="amt">1,200.00</td><td>已付</td></tr>
    <tr data-row="2" aria-selected="true"><td class="col-id">B-2002</td><td>乙公司</td><td class="amt">980.50</td><td>待付</td></tr>
    <tr data-row="3"><td class="col-id">B-2003</td><td>丙公司</td><td class="amt">3,410.00</td><td>已付</td></tr>
  </tbody>
</table>

</body>
</html>
